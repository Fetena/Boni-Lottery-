<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BONI Lottery - Full Management Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        input, textarea, select {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .text-gradient {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tab-button.active {
            border-bottom: 3px solid #FCD34D;
            color: #FCD34D !important;
        }

        .notification-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            z-index: 10000;
            animation: slideIn 0.3s ease;
            font-size: 13px;
            max-width: 90vw;
        }

        .notification-toast.success { background: #10b981; color: white; }
        .notification-toast.error { background: #ef4444; color: white; }
        .notification-toast.info { background: #3b82f6; color: white; }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        input[type="tel"],
        textarea,
        select {
            font-size: 16px !important; 
            padding: 12px !important;
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white">

    <div id="notification-container"></div>
    <div id="public-page"></div>
    <div id="main-admin-container"></div>
    <div id="admin-container"></div>
    <div id="customer-container"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBW0egtlG4JXjkoWB2Lfu5GcYhZz_oEjbI",
            authDomain: "boni-lottery-8d0e6.firebaseapp.com",
            projectId: "boni-lottery-8d0e6",
            storageBucket: "boni-lottery-8d0e6.appspot.com",
            messagingSenderId: "479140405683",
            appId: "1:479140405683:web:20a2205ece9fdcdf076bc6",
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        let currentUser = null;
        let sessionTimeoutTimer = null;

        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch((error) => {
            console.error('Auth persistence error:', error);
        });

        function startSessionTimer() {
            if (sessionTimeoutTimer) clearTimeout(sessionTimeoutTimer);
            const SESSION_DURATION = 5 * 60 * 1000;
            sessionTimeoutTimer = setTimeout(() => {
                logout();
                notify('info', '⌛ Session expired. Please log in again.');
            }, SESSION_DURATION);
        }

        ['click', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(event => {
            document.addEventListener(event, () => {
                if (currentUser) startSessionTimer();
            });
        });

        function notify(type, message) {
            const container = document.getElementById('notification-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `notification-toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function logout() {
            currentUser = null;
            if (sessionTimeoutTimer) clearTimeout(sessionTimeoutTimer);
            firebase.auth().signOut().catch(() => {});
            
            document.getElementById('main-admin-container').innerHTML = '';
            document.getElementById('admin-container').innerHTML = '';
            document.getElementById('customer-container').innerHTML = '';
            document.getElementById('public-page').innerHTML = renderPublicPage();
            notify('success', '✅ Logged out securely');
        }

        function renderPublicPage() {
            return `
                <div class="min-h-screen bg-black flex flex-col">
                    <header class="sticky top-0 z-40 w-full glass-panel border-b border-yellow-400/10 px-3 sm:px-6 py-3 sm:py-4">
                        <div class="max-w-7xl mx-auto flex items-center justify-between">
                            <h1 class="font-bold text-lg sm:text-2xl text-gradient">🎰 BONI LOTTERY</h1>
                            <div class="flex gap-2">
                                <button onclick="openLoginModal()" class="px-3 py-2 bg-transparent border border-yellow-400 text-yellow-400 font-bold rounded-lg text-xs sm:text-sm hover:bg-yellow-400/10">Login</button>
                                <button onclick="openSignupModal()" class="px-3 py-2 bg-yellow-400 text-black font-bold rounded-lg text-xs sm:text-sm hover:bg-yellow-500">Sign Up</button>
                            </div>
                        </div>
                    </header>
                    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
                        <div class="text-center max-w-2xl mx-auto">
                            <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-3 sm:mb-4">Welcome to BONI Lottery</h2>
                            <p class="text-sm sm:text-base text-slate-400 mb-6 sm:mb-8">Complete secure lottery and appointment management platform</p>
                            <button onclick="openSignupModal()" class="w-full sm:w-auto px-6 sm:px-8 py-3 bg-gradient-to-r from-yellow-400 to-yellow-600 text-black font-bold rounded-lg text-sm sm:text-base hover:shadow-lg transition-all">Get Started →</button>
                        </div>
                    </main>
                </div>

                <div id="login-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div class="glass-panel rounded-2xl p-6 sm:p-8 w-full max-w-sm border border-yellow-400/10 space-y-4 my-auto">
                        <h3 class="text-2xl font-bold text-white mb-4">Login</h3>
                        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs text-slate-400 mb-2">Email</label>
                                <input type="email" id="login-email" autocomplete="email" required placeholder="name@example.com" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm focus:outline-none focus:border-yellow-400">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-2">Password</label>
                                <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm focus:outline-none focus:border-yellow-400">
                            </div>
                            <button type="submit" class="w-full py-3 bg-yellow-400 text-black font-bold rounded-lg text-sm hover:bg-yellow-500 transition-colors">Login</button>
                        </form>
                        <button onclick="closeLoginModal()" class="w-full py-2 bg-slate-800 text-slate-300 rounded-lg text-xs hover:bg-slate-700">Cancel</button>
                    </div>
                </div>

                <div id="signup-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div class="glass-panel rounded-2xl p-6 sm:p-8 w-full max-w-sm border border-yellow-400/10 space-y-3 my-auto">
                        <h3 class="text-2xl font-bold text-white mb-4">Sign Up</h3>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Full Name</label>
                            <input type="text" id="signup-name" placeholder="John Doe" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Email</label>
                            <input type="email" id="signup-email" placeholder="customer@email.com" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Password</label>
                            <input type="password" id="signup-password" placeholder="••••••••" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Phone</label>
                            <input type="tel" id="signup-phone" placeholder="+251..." class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm">
                        </div>
                        <button onclick="handleSignup()" class="w-full py-3 bg-yellow-400 text-black font-bold rounded-lg text-sm hover:bg-yellow-500 transition-colors">Create Account</button>
                        <button onclick="closeSignupModal()" class="w-full py-2 bg-slate-800 text-slate-300 rounded-lg text-xs hover:bg-slate-700">Cancel</button>
                    </div>
                </div>
            `;
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); document.getElementById('login-email').focus(); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); document.getElementById('login-form').reset(); }
        function openSignupModal() { document.getElementById('signup-modal').classList.remove('hidden'); document.getElementById('signup-name').focus(); }
        function closeSignupModal() { document.getElementById('signup-modal').classList.add('hidden'); }

        async function handleLogin(event) {
            if (event) event.preventDefault();
            const email = document.getElementById('login-email')?.value || '';
            const password = document.getElementById('login-password')?.value || '';

            if (!email || !password) {
                notify('error', '❌ Please fill all fields');
                return;
            }

            if (email === 'fita.regassa@gmail.com' && password === 'fita123') {
                currentUser = { type: 'main_admin', email };
                startSessionTimer();
                closeLoginModal();
                document.getElementById('public-page').innerHTML = '';
                window.mainAdminDashboard = new MainAdminDashboard();
                document.getElementById('main-admin-container').innerHTML = window.mainAdminDashboard.render();
                await window.mainAdminDashboard.loadData();
                notify('success', '✅ Main Admin Login Successful');
                return;
            }

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                const adminDoc = await db.collection('admins').doc(email).get();
                if (adminDoc.exists) {
                    currentUser = { type: 'admin', email };
                    startSessionTimer();
                    closeLoginModal();
                    document.getElementById('public-page').innerHTML = '';
                    window.adminDashboard = new AdminDashboard(email);
                    document.getElementById('admin-container').innerHTML = window.adminDashboard.render();
                    await window.adminDashboard.loadData();
                    notify('success', '✅ Admin Login Successful');
                    return;
                }

                const customerDoc = await db.collection('customer_settings').doc(email).get();
                if (customerDoc.exists) {
                    const customerData = customerDoc.data();
                    currentUser = { type: 'customer', email, name: customerData.customerName || email.split('@')[0] };
                    startSessionTimer();
                    closeLoginModal();
                    document.getElementById('public-page').innerHTML = '';
                    window.customerDashboard = new CustomerDashboard(email);
                    document.getElementById('customer-container').innerHTML = window.customerDashboard.render();
                    await window.customerDashboard.loadData();
                    notify('success', '✅ Login Successful');
                    return;
                } else {
                    currentUser = { type: 'customer', email, name: email.split('@')[0] };
                    startSessionTimer();
                    closeLoginModal();
                    document.getElementById('public-page').innerHTML = '';
                    window.customerDashboard = new CustomerDashboard(email);
                    document.getElementById('customer-container').innerHTML = window.customerDashboard.render();
                    await window.customerDashboard.loadData();
                    notify('success', '✅ Login Successful');
                }
            } catch (error) {
                notify('error', `❌ Authentication Error: ${error.message}`);
            }
        }

        async function handleSignup() {
            const name = document.getElementById('signup-name')?.value.trim() || '';
            const email = document.getElementById('signup-email')?.value || '';
            const password = document.getElementById('signup-password')?.value || '';
            const phone = document.getElementById('signup-phone')?.value.trim() || '';

            if (!name || !email || !password) {
                notify('error', '❌ Please fill all required fields');
                return;
            }

            if (password.length < 6) {
                notify('error', '❌ Password must be at least 6 characters');
                return;
            }

            try {
                await firebase.auth().createUserWithEmailAndPassword(email, password);
                await db.collection('customer_settings').doc(email).set({
                    customerName: name,
                    email: email,
                    phone: phone,
                    createdAt: new Date(),
                    accountStatus: 'active'
                });

                notify('success', '✅ Account created! Please login.');
                closeSignupModal();
                openLoginModal();
            } catch (error) {
                notify('error', `❌ ${error.message}`);
            }
        }

        // --- Main Admin Dashboard Class ---
        class MainAdminDashboard {
            constructor() {
                this.activeTab = 'overview';
            }
            render() {
                return `
                    <div class="min-h-screen bg-black flex flex-col">
                        <header class="glass-panel border-b border-yellow-400/10 px-4 py-3 flex justify-between items-center">
                            <h1 class="text-lg font-bold text-gradient">👑 Main Admin Panel</h1>
                            <button onclick="logout()" class="px-3 py-1.5 bg-red-500/20 text-red-400 rounded-lg text-xs font-bold">Logout</button>
                        </header>
                        <div class="flex border-b border-yellow-400/10 px-4 gap-4 bg-slate-900/50">
                            <button onclick="window.mainAdminDashboard.switchTab('overview')" class="tab-button ${this.activeTab==='overview'?'active':''} py-3 text-xs font-bold text-slate-400">Overview</button>
                            <button onclick="window.mainAdminDashboard.switchTab('admins')" class="tab-button ${this.activeTab==='admins'?'active':''} py-3 text-xs font-bold text-slate-400">Manage Admins</button>
                        </div>
                        <main class="p-4 flex-grow" id="main-admin-content">
                            <p class="text-slate-400">Loading system parameters...</p>
                        </main>
                    </div>
                `;
            }
            async switchTab(tab) {
                this.activeTab = tab;
                document.getElementById('main-admin-container').innerHTML = this.render();
                await this.loadData();
            }
            async loadData() {
                const container = document.getElementById('main-admin-content');
                if (!container) return;
                if (this.activeTab === 'overview') {
                    container.innerHTML = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="glass-panel p-4 rounded-xl border border-yellow-400/10">
                                <h3 class="text-sm font-bold text-slate-400">Platform Status</h3>
                                <p class="text-2xl font-bold text-green-400 mt-2">Active & Secure</p>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="glass-panel p-4 rounded-xl border border-yellow-400/10 space-y-4">
                            <h3 class="text-base font-bold text-yellow-400">Branch Administrators</h3>
                            <p class="text-xs text-slate-400">Configure or invite new sub-admins here.</p>
                        </div>
                    `;
                }
            }
        }

        // --- Branch Admin Dashboard Class ---
        class AdminDashboard {
            constructor(email) {
                this.email = email;
                this.activeTab = 'appointments';
            }
            render() {
                return `
                    <div class="min-h-screen bg-black flex flex-col">
                        <header class="glass-panel border-b border-yellow-400/10 px-4 py-3 flex justify-between items-center">
                            <h1 class="text-lg font-bold text-gradient">🛠️ Admin Dashboard (${this.email})</h1>
                            <button onclick="logout()" class="px-3 py-1.5 bg-red-500/20 text-red-400 rounded-lg text-xs font-bold">Logout</button>
                        </header>
                        <div class="flex border-b border-yellow-400/10 px-4 gap-4 bg-slate-900/50">
                            <button onclick="window.adminDashboard.switchTab('appointments')" class="tab-button ${this.activeTab==='appointments'?'active':''} py-3 text-xs font-bold text-slate-400">Appointments</button>
                            <button onclick="window.adminDashboard.switchTab('settings')" class="tab-button ${this.activeTab==='settings'?'active':''} py-3 text-xs font-bold text-slate-400">Settings</button>
                        </div>
                        <main class="p-4 flex-grow" id="admin-content">
                            <p class="text-slate-400">Loading appointments...</p>
                        </main>
                    </div>
                `;
            }
            async switchTab(tab) {
                this.activeTab = tab;
                document.getElementById('admin-container').innerHTML = this.render();
                await this.loadData();
            }
            async loadData() {
                const container = document.getElementById('admin-content');
                if (!container) return;
                if (this.activeTab === 'appointments') {
                    try {
                        const snap = await db.collection('customer_appointments').get();
                        let html = '<div class="space-y-3"><h3 class="text-sm font-bold text-yellow-400">Customer Appointments</h3>';
                        if (snap.empty) {
                            html += '<p class="text-xs text-slate-500">No appointments found.</p>';
                        } else {
                            snap.forEach(doc => {
                                const d = doc.data();
                                html += `
                                    <div class="glass-panel p-3 rounded-lg border border-yellow-400/10 flex justify-between items-center text-xs">
                                        <div>
                                            <p class="font-bold text-white">${d.customerName || 'Customer'} - ${d.service || 'General'}</p>
                                            <p class="text-slate-400">Date: ${d.date || 'N/A'} | Status: <span class="text-yellow-400">${d.status || 'Pending'}</span></p>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        html += '</div>';
                        container.innerHTML = html;
                    } catch (e) {
                        container.innerHTML = `<p class="text-red-400 text-xs">Error loading data: ${e.message}</p>`;
                    }
                } else {
                    container.innerHTML = `<div class="glass-panel p-4 rounded-xl border border-yellow-400/10"><p class="text-xs text-slate-400">Admin profile settings configuration.</p></div>`;
                }
            }
        }

        // --- Customer Dashboard Class ---
        class CustomerDashboard {
            constructor(email) {
                this.email = email;
                this.activeTab = 'book';
            }
            render() {
                return `
                    <div class="min-h-screen bg-black flex flex-col">
                        <header class="glass-panel border-b border-yellow-400/10 px-4 py-3 flex justify-between items-center">
                            <h1 class="text-lg font-bold text-gradient">👤 Customer Portal</h1>
                            <button onclick="logout()" class="px-3 py-1.5 bg-red-500/20 text-red-400 rounded-lg text-xs font-bold">Logout</button>
                        </header>
                        <div class="flex border-b border-yellow-400/10 px-4 gap-4 bg-slate-900/50">
                            <button onclick="window.customerDashboard.switchTab('book')" class="tab-button ${this.activeTab==='book'?'active':''} py-3 text-xs font-bold text-slate-400">Book Appointment</button>
                            <button onclick="window.customerDashboard.switchTab('my-appointments')" class="tab-button ${this.activeTab==='my-appointments'?'active':''} py-3 text-xs font-bold text-slate-400">My Appointments</button>
                        </div>
                        <main class="p-4 flex-grow" id="customer-content">
                            <p class="text-slate-400">Loading customer portal...</p>
                        </main>
                    </div>
                `;
            }
            async switchTab(tab) {
                this.activeTab = tab;
                document.getElementById('customer-container').innerHTML = this.render();
                await this.loadData();
            }
            async loadData() {
                const container = document.getElementById('customer-content');
                if (!container) return;
                if (this.activeTab === 'book') {
                    container.innerHTML = `
                        <div class="glass-panel p-4 rounded-xl border border-yellow-400/10 max-w-lg mx-auto space-y-4">
                            <h3 class="text-base font-bold text-yellow-400">Schedule New Appointment</h3>
                            <form onsubmit="window.customerDashboard.handleBooking(event)" class="space-y-3">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Service Type</label>
                                    <input type="text" id="booking-service" required placeholder="Lottery Verification / Ticket Purchase" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Date & Time</label>
                                    <input type="date" id="booking-date" required class="w-full bg-black/40 border border-yellow-400/20 rounded-lg text-white text-sm">
                                </div>
                                <button type="submit" class="w-full py-3 bg-yellow-400 text-black font-bold rounded-lg text-sm hover:bg-yellow-500">Confirm Booking</button>
                            </form>
                        </div>
                    `;
                } else {
                    try {
                        const snap = await db.collection('customer_appointments').where('email', '==', this.email).get();
                        let html = '<div class="space-y-3 max-w-lg mx-auto"><h3 class="text-sm font-bold text-yellow-400">Your Booked Appointments</h3>';
                        if (snap.empty) {
                            html += '<p class="text-xs text-slate-500">You have no active appointments.</p>';
                        } else {
                            snap.forEach(doc => {
                                const d = doc.data();
                                html += `
                                    <div class="glass-panel p-3 rounded-lg border border-yellow-400/10 flex justify-between items-center text-xs">
                                        <div>
                                            <p class="font-bold text-white">${d.service || 'Service'}</p>
                                            <p class="text-slate-400">Date: ${d.date || 'N/A'} | Status: <span class="text-yellow-400">${d.status || 'Pending'}</span></p>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        html += '</div>';
                        container.innerHTML = html;
                    } catch (e) {
                        container.innerHTML = `<p class="text-red-400 text-xs">Error loading appointments: ${e.message}</p>`;
                    }
                }
            }
            async handleBooking(e) {
                e.preventDefault();
                const service = document.getElementById('booking-service').value.trim();
                const date = document.getElementById('booking-date').value;

                if (!service || !date) {
                    notify('error', '❌ Please complete all booking fields');
                    return;
                }

                try {
                    await db.collection('customer_appointments').add({
                        email: this.email,
                        customerName: currentUser?.name || this.email.split('@')[0],
                        service,
                        date,
                        status: 'Pending',
                        createdAt: new Date()
                    });
                    notify('success', '✅ Appointment successfully booked!');
                    this.switchTab('my-appointments');
                } catch (error) {
                    notify('error', `❌ Booking failed: ${error.message}`);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user && !currentUser) {
                    document.getElementById('public-page').innerHTML = renderPublicPage();
                }
            });
        });
    </script>
</body>
</html>
