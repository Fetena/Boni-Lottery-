<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BONI Lottery - Management Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        input, textarea, select {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .text-gradient {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tab-button.active {
            border-bottom: 3px solid #FCD34D;
            color: #FCD34D;
        }

        .notification-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            z-index: 10000;
            animation: slideIn 0.3s ease;
            font-size: 13px;
            max-width: 90vw;
        }

        .notification-toast.success { background: #10b981; color: white; }
        .notification-toast.error { background: #ef4444; color: white; }
        .notification-toast.info { background: #3b82f6; color: white; }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        textarea,
        select {
            font-size: 16px !important;
            padding: 12px !important;
        }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(2);
            cursor: pointer;
            opacity: 1;
        }

        .btn-primary {
            transition: all 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        @media (max-width: 640px) {
            .hide-on-mobile { display: none !important; }
            .glass-panel { border-radius: 12px; }
            .notification-toast { 
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
                margin: 0 10px;
            }
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="bg-black text-white">

    <!-- NOTIFICATION CONTAINER -->
    <div id="notification-container"></div>

    <!-- PUBLIC PAGE -->
    <div id="public-page"></div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="main-admin-container"></div>

    <!-- BRANCH ADMIN DASHBOARD -->
    <div id="admin-container"></div>

    <!-- CUSTOMER DASHBOARD -->
    <div id="customer-container"></div>

    <!-- ============================================
         DASHBOARD COMPONENT SCRIPTS (LOAD FIRST)
         ============================================ -->
    <script src="CustomerDashboard_MOBILE_OPTIMIZED.js"></script>
    <script src="AdminDashboard_MOBILE_OPTIMIZED (1).js"></script>
    <script src="MainAdminDashboard_MOBILE_OPTIMIZED.js"></script>

    <!-- ============================================
         FIREBASE & GLOBAL SETUP
         ============================================ -->
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBW0egtlG4JXjkoWB2Lfu5GcYhZz_oEjbI",
            authDomain: "boni-lottery-8d0e6.firebaseapp.com",
            projectId: "boni-lottery-8d0e6",
            storageBucket: "boni-lottery-8d0e6.appspot.com",
            messagingSenderId: "479140405683",
            appId: "1:479140405683:web:20a2205ece9fdcdf076bc6",
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let currentUser = null;
        let sessionTimeoutTimer = null;

        console.log('✅ Firebase initialized');
        console.log('✅ Firestore ready');

        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch((error) => {
            console.error('Auth persistence error:', error);
        });

        // Session timeout (5 minutes)
        function startSessionTimer() {
            if (sessionTimeoutTimer) clearTimeout(sessionTimeoutTimer);
            const SESSION_DURATION = 5 * 60 * 1000;
            
            sessionTimeoutTimer = setTimeout(() => {
                logout();
                notify('info', '⌛ Session expired. Please log in again.');
            }, SESSION_DURATION);
        }

        // Reset timer on activity
        ['click', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(event => {
            document.addEventListener(event, () => {
                if (currentUser) {
                    startSessionTimer();
                }
            });
        });

        // Notification System
        function notify(type, message) {
            const container = document.getElementById('notification-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `notification-toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Logout Function
        function logout() {
            currentUser = null;
            if (sessionTimeoutTimer) clearTimeout(sessionTimeoutTimer);
            firebase.auth().signOut().catch(() => {});
            
            document.getElementById('main-admin-container').innerHTML = '';
            document.getElementById('admin-container').innerHTML = '';
            document.getElementById('customer-container').innerHTML = '';
            document.getElementById('public-page').innerHTML = renderPublicPage();
            notify('success', '✅ Logged out');
        }

        // ===== MOBILE-OPTIMIZED PUBLIC PAGE =====
        function renderPublicPage() {
            return `
                <div class="min-h-screen bg-black flex flex-col">
                    <!-- Header -->
                    <header class="sticky top-0 z-40 w-full glass-panel border-b border-yellow-400/10 px-3 sm:px-6 py-3 sm:py-4">
                        <div class="max-w-7xl mx-auto flex items-center justify-between">
                            <h1 class="font-bold text-lg sm:text-2xl text-gradient">🎰 BONI LOTTERY</h1>
                            <div class="flex gap-2">
                                <button onclick="openLoginModal()" class="px-3 py-2 bg-transparent border border-yellow-400 text-yellow-400 font-bold rounded-lg text-xs sm:text-sm hover:bg-yellow-400/10">Login</button>
                                <button onclick="openSignupModal()" class="px-3 py-2 bg-yellow-400 text-black font-bold rounded-lg text-xs sm:text-sm hover:bg-yellow-500">Sign Up</button>
                            </div>
                        </div>
                    </header>

                    <!-- Hero Section -->
                    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
                        <div class="text-center max-w-2xl mx-auto">
                            <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-3 sm:mb-4">Welcome to BONI Lottery</h2>
                            <p class="text-sm sm:text-base text-slate-400 mb-6 sm:mb-8">Complete lottery management platform for desktop and mobile devices</p>
                            <button onclick="openSignupModal()" class="w-full sm:w-auto px-6 sm:px-8 py-3 bg-gradient-to-r from-yellow-400 to-yellow-600 text-black font-bold rounded-lg text-sm sm:text-base hover:shadow-lg hover:shadow-yellow-500/50 transition-all">Get Started →</button>
                        </div>
                    </main>
                </div>

                <!-- ===== LOGIN MODAL (MOBILE OPTIMIZED) ===== -->
                <div id="login-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div class="glass-panel rounded-2xl p-6 sm:p-8 w-full max-w-sm border border-yellow-400/10 space-y-4 my-auto">
                        <h3 class="text-2xl font-bold text-white mb-4">Login</h3>
                        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                            <div>
                                <label class="block text-xs text-slate-400 mb-2">Email (Case Sensitive)</label>
                                <input type="email" id="login-email" autocomplete="email" required placeholder="name@example.com" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg py-3 px-4 text-white text-sm placeholder-slate-600 focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-2">Password (Case Sensitive)</label>
                                <input type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg py-3 px-4 text-white text-sm placeholder-slate-600 focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400">
                            </div>
                            <button type="submit" class="w-full py-3 bg-yellow-400 text-black font-bold rounded-lg text-sm hover:bg-yellow-500 transition-colors btn-primary">Login</button>
                        </form>
                        <button onclick="closeLoginModal()" class="w-full py-2 bg-slate-800 text-slate-300 rounded-lg text-xs hover:bg-slate-700">Cancel</button>
                        <p class="text-xs text-slate-500 text-center mt-3">💡 Hint: Press Enter to login</p>
                    </div>
                </div>

                <!-- ===== SIGNUP MODAL (MOBILE OPTIMIZED) ===== -->
                <div id="signup-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div class="glass-panel rounded-2xl p-6 sm:p-8 w-full max-w-sm border border-yellow-400/10 space-y-3 my-auto">
                        <h3 class="text-2xl font-bold text-white mb-4">Sign Up</h3>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Full Name</label>
                            <input type="text" id="signup-name" autocomplete="name" placeholder="John Doe" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg py-3 px-4 text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Email (Case Sensitive)</label>
                            <input type="email" id="signup-email" autocomplete="email" placeholder="customer@email.com" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg py-3 px-4 text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Password (Case Sensitive)</label>
                            <input type="password" id="signup-password" autocomplete="new-password" placeholder="••••••••" class="w-full bg-black/40 border border-yellow-400/20 rounded-lg py-3 px-4 text-white text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">Phone</label>
                            <input type="tel" id="signup-phone" placeholder="+251..." class="w-full bg-black/40 border border-yellow-400/20 rounded-lg py-3 px-4 text-white text-sm">
                        </div>
                        <button onclick="handleSignup()" class="w-full py-3 bg-yellow-400 text-black font-bold rounded-lg text-sm hover:bg-yellow-500 transition-colors btn-primary">Create Account</button>
                        <button onclick="closeSignupModal()" class="w-full py-2 bg-slate-800 text-slate-300 rounded-lg text-xs hover:bg-slate-700">Cancel</button>
                    </div>
                </div>
            `;
        }

        // ===== LOGIN/SIGNUP MODAL HANDLERS =====
        function openLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-email').focus();
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-form').reset();
        }

        function openSignupModal() {
            document.getElementById('signup-modal').classList.remove('hidden');
            document.getElementById('signup-name').focus();
        }

        function closeSignupModal() {
            document.getElementById('signup-modal').classList.add('hidden');
        }

        // ===== ENHANCED LOGIN (CASE SENSITIVE + ENTER KEY) =====
        async function handleLogin(event) {
            if (event) event.preventDefault();
            
            const email = document.getElementById('login-email')?.value || '';
            const password = document.getElementById('login-password')?.value || '';

            if (!email || !password) {
                notify('error', '❌ Please fill all fields');
                return;
            }

            // Main Admin Check (CASE SENSITIVE)
            if (email === 'fita.regassa@gmail.com' && password === 'fita123') {
                currentUser = { type: 'main_admin', email };
                startSessionTimer();
                closeLoginModal();
                document.getElementById('public-page').innerHTML = '';
                
                if (!window.mainAdminDashboard) {
                    window.mainAdminDashboard = new MainAdminDashboard();
                }
                document.getElementById('main-admin-container').innerHTML = window.mainAdminDashboard.render();
                await window.mainAdminDashboard.loadData();
                localStorage.setItem('currentAdminEmail', email);
                notify('success', '✅ Main Admin Login Successful');
                return;
            }

            // Branch Admin Check
            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                const adminDoc = await db.collection('admins').doc(email).get();
                
                if (adminDoc.exists) {
                    currentUser = { type: 'admin', email };
                    startSessionTimer();
                    closeLoginModal();
                    document.getElementById('public-page').innerHTML = '';
                    
                    if (!window.adminDashboard) {
                        window.adminDashboard = new AdminDashboard(email);
                    }
                    document.getElementById('admin-container').innerHTML = window.adminDashboard.render();
                    await window.adminDashboard.loadData();
                    localStorage.setItem('currentAdminEmail', email);
                    notify('success', '✅ Admin Login Successful');
                    return;
                }
            } catch (error) {
                console.log('Not a branch admin:', error.message);
            }

            // Customer Check
            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                const customerDoc = await db.collection('customer_settings').doc(email).get();
                
                if (customerDoc.exists) {
                    const customerData = customerDoc.data();
                    currentUser = { type: 'customer', email, name: customerData.customerName || email.split('@')[0] };
                    startSessionTimer();
                    closeLoginModal();
                    document.getElementById('public-page').innerHTML = '';
                    
                    if (!window.customerDashboard) {
                        window.customerDashboard = new CustomerDashboard(email);
                    }
                    document.getElementById('customer-container').innerHTML = window.customerDashboard.render();
                    await window.customerDashboard.loadData();
                    notify('success', '✅ Login Successful');
                    return;
                }
            } catch (error) {
                console.log('Not a customer:', error.message);
            }

            notify('error', '❌ Invalid email or password');
        }

        // ===== SIGNUP HANDLER =====
        async function handleSignup() {
            const name = document.getElementById('signup-name')?.value.trim() || '';
            const email = document.getElementById('signup-email')?.value || '';
            const password = document.getElementById('signup-password')?.value || '';
            const phone = document.getElementById('signup-phone')?.value.trim() || '';

            if (!name || !email || !password) {
                notify('error', '❌ Please fill all required fields');
                return;
            }

            if (password.length < 6) {
                notify('error', '❌ Password must be at least 6 characters');
                return;
            }

            try {
                await firebase.auth().createUserWithEmailAndPassword(email, password);
                await db.collection('customer_settings').doc(email).set({
                    customerName: name,
                    email: email,
                    phone: phone,
                    createdAt: new Date(),
                    cbeAccount: '',
                    accountStatus: 'active'
                });

                notify('success', '✅ Account created! Please login.');
                closeSignupModal();
                openLoginModal();
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    notify('error', '❌ Email already registered');
                } else {
                    notify('error', `❌ ${error.message}`);
                }
            }
        }

        // ===== INITIALIZE APP =====
        document.addEventListener('DOMContentLoaded', () => {
            let authChecked = false;

            firebase.auth().onAuthStateChanged(async (user) => {
                authChecked = true;
                if (user) {
                    const email = user.email;
                    
                    if (email === 'fita.regassa@gmail.com') {
                        currentUser = { type: 'main_admin', email };
                        startSessionTimer();
                        document.getElementById('public-page').innerHTML = '';
                        if (!window.mainAdminDashboard) {
                            window.mainAdminDashboard = new MainAdminDashboard();
                        }
                        document.getElementById('main-admin-container').innerHTML = window.mainAdminDashboard.render();
                        await window.mainAdminDashboard.loadData();
                    } else {
                        const adminDoc = await db.collection('admins').doc(email).get();
                        if (adminDoc.exists) {
                            currentUser = { type: 'admin', email };
                            startSessionTimer();
                            document.getElementById('public-page').innerHTML = '';
                            if (!window.adminDashboard) {
                                window.adminDashboard = new AdminDashboard(email);
                            }
                            document.getElementById('admin-container').innerHTML = window.adminDashboard.render();
                            await window.adminDashboard.loadData();
                            return;
                        }

                        const customerDoc = await db.collection('customer_settings').doc(email).get();
                        if (customerDoc.exists) {
                            const customerData = customerDoc.data();
                            currentUser = { type: 'customer', email, name: customerData.customerName || email.split('@')[0] };
                            startSessionTimer();
                            document.getElementById('public-page').innerHTML = '';
                            if (!window.customerDashboard) {
                                window.customerDashboard = new CustomerDashboard(email);
                            }
                            document.getElementById('customer-container').innerHTML = window.customerDashboard.render();
                            await window.customerDashboard.loadData();
                            return;
                        }
                    }
                } else {
                    if (!authChecked) return;
                    document.getElementById('public-page').innerHTML = renderPublicPage();
                }
            });

            // ===== ENTER KEY SUPPORT FOR LOGIN =====
            document.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const loginModal = document.getElementById('login-modal');
                    if (loginModal && !loginModal.classList.contains('hidden')) {
                        e.preventDefault();
                        handleLogin(e);
                    }
                }
            });
        });
    </script>
</body>

</html>
